[project]
name = "phoebe"
version = "0.1.0"
description = "Phoebe onboarding portal backend"
requires-python = ">=3.14"
dependencies = [
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/phoebe"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]

[tool.ruff]
extend-exclude = ["docs", ".superpowers"]
src = ["backend/src", "backend/tests"]

[tool.pyright]
include = ["backend"]
extraPaths = ["backend/src"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[project]
name = "phoebe"
version = "0.1.0"
description = "Phoebe onboarding portal backend"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "boto3>=1.44.0",
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pypdf>=7.0.1",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/phoebe"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]

[tool.ruff]
extend-exclude = ["docs", ".superpowers"]
src = ["backend/src", "backend/tests"]

[tool.pyright]
include = ["backend"]
extraPaths = ["backend/src"]

[dependency-groups]
dev = [
    "fpdf2>=2.9.0",
    "moto[dynamodb]>=5.2.5",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261111",
]

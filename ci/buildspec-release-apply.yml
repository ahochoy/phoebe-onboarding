version: 0.2

# phoebe-release-apply: pipeline Apply stage, after the owner's approval
# (phoebe-ci-deploy-production). Applies the saved plan from the `plan`
# artifact ($CODEBUILD_SRC_DIR_plan) without re-planning, runs the production
# steps of ci/deploy.sh, then adds the release-<tag> image tags.

env:
  shell: bash
  variables:
    TF_VERSION: "1.16.4"

phases:
  install:
    on-failure: ABORT
    runtime-versions:
      nodejs: 22
    commands:
      - bash ci/install-terraform.sh "$TF_VERSION"

  build:
    on-failure: ABORT
    commands:
      - bash ci/release-apply.sh "$CODEBUILD_SRC_DIR_plan"

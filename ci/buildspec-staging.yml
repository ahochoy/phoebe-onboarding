version: 0.2

# phoebe-staging: push to main (ARM, privileged; the only Docker build).
# Builds and pushes phoebe-api:<sha> (api) and <sha>-jobs (jobs), then
# ci/deploy.sh staging <api_digest> <jobs_digest>. See ci/staging.sh.
# Scripts run through bash: never with xtrace, and they log metadata only.

env:
  shell: bash
  variables:
    TF_VERSION: "1.16.4"

phases:
  install:
    on-failure: ABORT
    runtime-versions:
      nodejs: 22
    commands:
      - bash ci/install-terraform.sh "$TF_VERSION"

  build:
    on-failure: ABORT
    commands:
      - bash ci/staging.sh

name: ci

on:
  pull_request:
    branches: [main]
  push:
    # feat/** so a feature branch gets CI before it has a PR.
    branches: [main, "feat/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: phoebe
          POSTGRES_DB: phoebe_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PHOEBE_TEST_DATABASE_URL: postgresql://postgres:phoebe@localhost:5433/phoebe_test
      PHOEBE_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: make lint
      - run: uv run pytest backend/tests -q

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make fe-install
      - run: make fe-lint
      - run: make fe-test
      - run: make fe-build

  # Offline Terraform checks (mock providers) and the ci/ script tests (stubbed
  # binaries). Holds no AWS credentials and makes no AWS calls.
  infra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: make tf-check
      - run: make deploy-check

  # Cross-browser Playwright suite against the local Docker Compose stack.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make fe-install
      - run: make stack-e2e
      # Some runners point apt at us-east-2.ec2.archive.ubuntu.com, which has served the
      # ~125 MB of browser system packages at ~100 kB/s (17-26 minutes). The Azure mirror,
      # the default on the other runners, takes seconds. The runner image lists its
      # mirrors in apt-mirrors.txt (ubuntu.sources points at it with `mirror+file:`), so
      # rewrite both and print them.
      - name: Use the Azure Ubuntu mirror
        run: |
          for src in /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources; do
            test -e "$src" || continue
            if grep -qE '\.ec2\.archive\.ubuntu\.com' "$src"; then echo "rewriting the EC2 mirror in $src"; fi
            sudo sed -i -E 's#https?://[a-z0-9.-]+\.ec2\.archive\.ubuntu\.com#http://azure.archive.ubuntu.com#g' "$src"
            echo "== $src"; grep -E "^URIs:|://" "$src"
          done
      - name: Install Playwright browsers
        working-directory: frontend
        timeout-minutes: 10
        run: npx playwright install --with-deps
      - run: make e2e
      - name: API logs
        if: failure()
        run: docker compose logs --tail 200 api
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

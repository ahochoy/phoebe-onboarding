# Phoebe chat evals: the question set. All seed data is synthetic.
#
# Every case runs as the seeded persona Alex Rivera (Platform team; sees the
# company, Engineering and Platform documents). Expectations come from the seed
# sources in backend/seed/content/, never from a model's output.
#
# expect:
#   answered: true | false
#   code: refusal code(s) when refused (backend/src/phoebe/chat/refusals.py):
#         1001 not found, 1204 couldn't verify, 2307 blocked, 3115 model unavailable
#   must_cite: any one of these document titles is cited
#   must_not_cite: never cited, nor offered among the closest documents
#   must_contain / must_not_contain: case-insensitive substrings of the answer
#
# Keep must_contain to short facts any correct answer states (numbers, names).

# ---- Single facts ------------------------------------------------------------------

- id: pto-days
  category: fact
  turns:
    - question: How many PTO days do I get?
      expect: {answered: true, must_cite: [Employee Handbook, Benefits Guide], must_contain: ["20"]}

- id: pto-carryover
  category: fact
  turns:
    - question: How many unused PTO days can I carry over into next year?
      expect: {answered: true, must_cite: [Employee Handbook], must_contain: ["5"]}

- id: benefits-window
  category: fact
  turns:
    - question: How long do I have to enroll in benefits after I start?
      expect: {answered: true, must_cite: [Benefits Guide, Employee Handbook, First-Week Schedule], must_contain: ["30"]}

- id: retirement-match
  category: fact
  turns:
    - question: What is the 401(k) match?
      expect: {answered: true, must_cite: [Benefits Guide, Employee Handbook], must_contain: ["4%"]}

- id: password-length
  category: fact
  turns:
    - question: How long does my password need to be?
      expect: {answered: true, must_cite: [IT and Security Policy], must_contain: ["14"]}

- id: lost-laptop
  category: fact
  turns:
    - question: How quickly do I have to report a lost laptop?
      expect: {answered: true, must_cite: [IT and Security Policy], must_contain: ["hour"]}

- id: onboarding-buddy
  category: fact
  turns:
    - question: Who is my onboarding buddy?
      expect: {answered: true, must_cite: [Team Breakdown, First-Week Schedule], must_contain: ["Jordan Moore"]}

- id: manager-one-on-ones

tasks:
  # Company (6)
  - {key: hr-paperwork, group: larkspur, position: 1, title: Complete your HR paperwork,
     description: "Fill in your I-9, tax withholding and direct deposit details in the People portal."}
  - {key: setup-2fa, group: larkspur, position: 2, title: Set up single sign-on and two-factor authentication,
     description: "Required before you can reach any internal service. A hardware key or authenticator app works."}
  - {key: sign-conduct, group: larkspur, position: 3, title: Review and accept the code of conduct,
     description: "Part of the Employee Handbook. It takes about five minutes to read."}
  - {key: enroll-benefits, group: larkspur, position: 4, title: Enroll in benefits within 30 days,
     description: "Choose medical, dental and vision plans and set your 401(k) contribution.",
     link: "https://larkspur-labs.example/benefits"}
  - {key: read-handbook, group: larkspur, position: 5, title: Read the Employee Handbook,
     description: "Skim it, then flag anything that surprises you to your buddy."}
  - {key: security-training, group: larkspur, position: 6, title: Complete security awareness training,
     description: "A 45 minute course, due within your first two weeks."}
  # Engineering (4)
  - {key: laptop-setup, group: engineering, position: 1, title: Set up your laptop,
     description: "Install the device management profile, password manager and developer tools."}
  - {key: repo-access, group: engineering, position: 2, title: Get access to GitHub and the main repositories,
     description: "Ask in the engineering channel if an invitation has not arrived by the end of day one."}
  - {key: dev-environment, group: engineering, position: 3, title: Run the local development environment,
     description: "Follow the local development guide and run a test suite end to end."}
  - {key: read-eng-practices, group: engineering, position: 4, title: Read the Engineering Practices and On-call Guide,
     description: "You will shadow on-call in your second month."}
  # Platform (4)
  - {key: meet-buddy, group: platform, position: 1, title: Meet your onboarding buddy,
     description: "Mei Tanaka will have lunch with you on your first day."}
  - {key: platform-tour, group: platform, position: 2, title: Take the Platform systems tour,
     description: "Beacon, Trellis, Lantern, Atlas and Kit at a high level."}
  - {key: first-pr, group: platform, position: 3, title: Ship your first pull request,
     description: "Pick a starter ticket with your buddy and get it merged and deployed."}
  - {key: lantern-walkthrough, group: platform, position: 4, title: Walk through the Lantern dashboards,
     description: "A short session with Anika Rao on how we watch our systems."}
  # Payments (3)
  - {key: pay-sandbox, group: payments, position: 1, title: Get access to the payments sandbox,
     description: "Sandbox credentials are issued by the Payments lead."}
  - {key: pay-runbook, group: payments, position: 2, title: Read the Payments Runbook,
     description: "Covers the charge pipeline, settlement and common alerts."}
  - {key: pay-shadow-settlement, group: payments, position: 3, title: Shadow a nightly settlement review,
     description: "Sit in on a settlement check with a teammate."}
  # Sales (4)
  - {key: sales-crm, group: sales, position: 1, title: Get your CRM login,
     description: "Sales Operations will invite you on your first day."}
  - {key: sales-playbook-read, group: sales, position: 2, title: Read the Sales Playbook,
     description: "Process stages, pricing and discount limits."}
  - {key: sales-shadow-calls, group: sales, position: 3, title: Shadow three discovery calls,
     description: "Listen in and write down the questions that worked."}
  - {key: sales-demo, group: sales, position: 4, title: Deliver a practice demo,
     description: "A 30 minute run-through with your team lead."}


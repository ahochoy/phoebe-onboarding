services:
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_PASSWORD: phoebe
      POSTGRES_DB: phoebe
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d phoebe"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    # Host port is configurable in case 8080 is taken; the container always uses 8080.
    ports:
      - "127.0.0.1:${PHOEBE_PORT:-8080}:8080"
    environment:
      PHOEBE_DATABASE_URL: postgresql://postgres:phoebe@db:5432/phoebe
      # Written to .env by `make stack`; empty default keeps `docker compose up db` working.
      PHOEBE_PASSWORD_HASH: ${PHOEBE_PASSWORD_HASH:-}
      PHOEBE_COOKIE_SECURE: "false"
      PHOEBE_SESSION_BACKEND: memory
      # Spend-safety caps, at the app defaults. `make stack-e2e` raises them because the
      # Playwright suite logs in and chats far more often than a person would.
      PHOEBE_LOGIN_PER_IP_WINDOW: ${PHOEBE_LOGIN_PER_IP_WINDOW:-10}
      PHOEBE_CHAT_GLOBAL_DAY: ${PHOEBE_CHAT_GLOBAL_DAY:-300}
      PHOEBE_UPLOADS_GLOBAL_DAY: ${PHOEBE_UPLOADS_GLOBAL_DAY:-50}

services:
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: phoebe
      POSTGRES_DB: phoebe
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d phoebe"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    # Host port is configurable in case 8080 is taken; the container always uses 8080.
    ports:
      - "${PHOEBE_PORT:-8080}:8080"
    environment:
      PHOEBE_DATABASE_URL: postgresql://postgres:phoebe@db:5432/phoebe
      # Written to .env by `make stack`; empty default keeps `docker compose up db` working.
      PHOEBE_PASSWORD_HASH: ${PHOEBE_PASSWORD_HASH:-}
      PHOEBE_COOKIE_SECURE: "false"
      PHOEBE_SESSION_BACKEND: memory
